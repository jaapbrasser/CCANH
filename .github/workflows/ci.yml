name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1
  # Compile sqlx::query! macros against the committed .sqlx/ cache.
  SQLX_OFFLINE: "true"

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      # Installs the toolchain pinned in rust-toolchain.toml.
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.1"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: test
        run: cargo test --locked

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  api-types:
    name: API type drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.1"
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: Check generated types are up to date
        shell: pwsh
        run: ./scripts/gen-api-types.ps1 -Check

  sqlx-cache:
    name: SQLx offline cache
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.1"
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: sqlx-cli
      - name: Check .sqlx is up to date
        shell: pwsh
        run: ./scripts/sqlx-prepare.ps1 -Check

  release-windows:
    name: Release build (Windows)
    needs: [rust, frontend]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.1"
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build embedded binary
        shell: pwsh
        run: ./scripts/build.ps1
      - name: No runtime dependencies beyond Windows
        shell: pwsh
        run: ./scripts/check-windows-deps.ps1 -Exe target/release/crane.exe
      - name: Smoke test
        shell: pwsh
        run: ./scripts/smoke-test.ps1 -Exe target/release/crane.exe
      - name: Windows service test
        shell: pwsh
        run: ./scripts/service-test.ps1 -Exe target/release/crane.exe
      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }
      - name: Build installer
        shell: pwsh
        run: ./scripts/build-installer.ps1
      - name: Installer test
        shell: pwsh
        run: ./scripts/installer-test.ps1 -Installer (Get-ChildItem dist/crane-setup-*.exe).FullName
      - uses: actions/upload-artifact@v4
        with:
          name: crane-setup-windows-x64
          path: dist/crane-setup-*.exe
          if-no-files-found: error
      - name: Build offline package
        shell: pwsh
        run: ./scripts/package-offline.ps1
      - name: Check the extracted package (Windows PowerShell 5.1)
        shell: pwsh
        run: |
          $zip = (Get-ChildItem dist/ccanh-offline-*.zip).FullName
          $dest = Join-Path $env:RUNNER_TEMP 'pkg'
          Expand-Archive $zip -DestinationPath $dest
          $pkg = (Get-ChildItem $dest -Directory | Select-Object -First 1).FullName
          & "$pkg\portable\crane.exe" --version
          if ($LASTEXITCODE -ne 0) { throw 'portable crane.exe failed' }
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File "$pkg\tools\Test-Ccanh.ps1" -Preflight
          if ($LASTEXITCODE -ne 0) { throw 'pre-flight check failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: ccanh-offline-windows-x64
          path: |
            dist/ccanh-offline-*.zip
            dist/ccanh-offline-*.zip.sha256
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: crane-windows-x64
          path: target/release/crane.exe
          if-no-files-found: error

  e2e:
    name: End-to-end (Playwright, demo mode)
    needs: [rust, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.1"
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build embedded binary
        shell: pwsh
        run: ./scripts/build.ps1
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run Playwright
        working-directory: frontend
        run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans licenses sources

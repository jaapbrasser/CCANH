# cargo-deny configuration: advisories, licenses, bans and sources.
# Run locally with `cargo deny check`.

[graph]
all-features = false

[advisories]
# Fail on vulnerabilities and unmaintained/unsound crates. Add explicit, commented
# exceptions under `ignore` only after review.
version = 2
yanked = "deny"
ignore = []

[licenses]
version = 2
# The project licence is undecided (SPEC §18 Q7). Allow permissive licences only.
# ISC: ring, rustls-webpki, untrusted (rustls stack).
# CDLA-Permissive-2.0: webpki-root-certs (Mozilla root CA data, via
# rustls-platform-verifier).
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "CC0-1.0",
    "ISC",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9
private = { ignore = true }

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

# Example CCANH configuration. Copy to `config.toml` next to crane.exe (or pass
# --config <file>). Every key is optional; defaults are shown.
# Environment overrides: CRANE_<SECTION>__<KEY>, e.g. CRANE_SERVER__PORT=9000.
# Precedence: CLI flags > environment > this file > defaults.

# "production" or "demo" (simulated cameras, separate demo.db; see docs/demo.md).
mode = "production"
# Demo mode only: keep demo.db between runs instead of reseeding it.
demo_keep_state = false

# Database, logs and keys. Default: %ProgramData%\CraneCamera on Windows, ./data elsewhere.
# data_dir = 'C:\ProgramData\CraneCamera'

[server]
bind = "127.0.0.1"
port = 8080
# Serve /api/docs and /api/openapi.json without signing in (default: admins only).
public_api_docs = false
shutdown_timeout_secs = 10
# Extra origins accepted by the CSRF check on state-changing requests, e.g. when
# users reach the server by a DNS name that differs from the Host header.
allowed_origins = []

[server.tls]
# "off" (plain HTTP; warns when bound to a non-loopback address),
# "files" (your own PEM certificate chain and key), or
# "self_signed" (generated into <data_dir>/tls/ on first run; fingerprint is logged).
mode = "off"
# cert_path = 'C:\ProgramData\CraneCamera\tls\server.crt'
# key_path = 'C:\ProgramData\CraneCamera\tls\server.key'
# Extra names for the self-signed certificate (localhost and the hostname are included).
self_signed_names = []

[auth]
# Sessions end after this long without activity...
idle_timeout_minutes = 480
# ...and this long after sign-in regardless of activity.
absolute_timeout_hours = 168
# How often an open WebSocket re-validates its session.
websocket_recheck_secs = 60

[monitoring]
# Seconds between status checks of each monitored camera, randomized by ±jitter.
interval_secs = 10
jitter_percent = 20
# Consecutive failed checks before a camera is shown as offline.
failure_threshold = 3
timeout_secs = 5
# Maximum checks in flight across all cameras.
max_concurrent = 32
# Minutes between identity/credential re-checks of an online camera.
identity_refresh_minutes = 15
# Extra attempts within one check for transient errors (never for auth failures).
retries = 1
# Offline cameras are checked less often, backing off up to this many seconds.
offline_max_interval_secs = 60
# All [monitoring] values are defaults: admins can override them at runtime
# under Settings (stored in the database).

[streaming]
# Seconds an unwatched stream stays connected before the upstream is closed.
grace_period_secs = 15
# In-memory GOP cache caps (never written to disk), per stream and in total.
stream_buffer_mb = 4
global_buffer_mb = 256
# Stream profile names to prefer fleet-wide (per camera overrides win). When
# unset or missing on a camera: smallest H.264 profile for grid tiles, largest
# for the detail view.
# default_grid_profile = "grid"
# default_detail_profile = "main"
# Camera-network bandwidth limits (0 = no limit). When max_upstreams is set,
# detail_reserve connections are kept free for detail views (grid tiles can't
# use them), so a full wall of tiles never blocks opening a camera.
max_upstreams = 0
detail_reserve = 2
max_inbound_mbps = 0

[discovery]
# Most addresses one scan may cover without explicit confirmation (about a /20).
max_addresses = 4096
# Hosts probed at once, and timeouts for the TCP check and identification request.
concurrency = 32
connect_timeout_ms = 1000
http_timeout_ms = 3000

[retention]
# Days of history to keep; a cleanup runs shortly after startup and then daily.
status_history_days = 30
# Finished tasks, including discovery scans and their results.
tasks_days = 30
# Audit log: 0 keeps it forever (the default); otherwise at least 90.
audit_days = 0

[camera_defaults]
# What a new camera gets when the admin doesn't choose (the add-camera form and
# discovery registration are pre-filled with these). The shipped values favour
# ease of use on a closed local network (ADR 0011); tighten them here or on the
# Settings page.
scheme = "http"                     # "http" or "https"
# Basic authentication over plain HTTP sends the camera password readable on the network.
allow_basic_over_http = true
# Certificate check for HTTPS cameras: "strict", "insecure_skip_verify"
# ("pinned" needs a fingerprint per camera, so it can't be a default).
tls_mode = "insecure_skip_verify"

[logging]
# tracing filter directive; RUST_LOG overrides it.
level = "info"
# "pretty" or "json" for console output. Log files are always JSON.
format = "pretty"
# Rolling daily files in <data_dir>/logs.
file = true
retention_days = 14

[workspace]
resolver = "2"
members = ["backend"]

[workspace.package]
version = "0.3.0"
edition = "2021"
rust-version = "1.94"
publish = false

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

# Argon2 is deliberately expensive; unoptimized it makes every test login take
# seconds. Optimize the hashing crates even in dev/test builds.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3

[package]
name = "streaming-spike"
version = "0.0.0"
edition = "2021"
publish = false

# Standalone: not part of the main workspace. Throwaway code (SPEC §7.3).
[workspace]

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
bytes = "1"
futures = "0.3"
retina = "0.4"
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.30"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
